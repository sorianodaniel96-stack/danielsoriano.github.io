<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - I miei Progetti</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header { margin-bottom: 3rem; text-align: center; }
    header h1 { font-size: 2.2rem; color: #fff; margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); font-size: 1.1rem; }
    .links { margin-top: 1rem; display: flex; justify-content: center; gap: 1rem; }
    .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; color: #fff; }
    .card p { color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .tag {
      font-size: 0.75rem;
      background: #334155;
      color: #cbd5e1;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .card-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .card-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Daniel Soriano</h1>
      <p>Sviluppatore & appassionato di tecnologia. Qui raccolgo i miei progetti personali e sperimentazioni.</p>
      <div class="links">
        <a href="https://github.com/tuo-username" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/tuo-profilo" target="_blank">LinkedIn</a>
      </div>
    </header>

    <section class="projects-grid">
      <article class="card">
        <h2></h2>
        <p></p>
        <div class="tags">
          <span class="tag">Python</span>
        </div>
        <a href="#" class="card-link" target="_blank">Vedi repository &rarr;</a>
      </article>

      <article class="card">
        <h2></h2>
        <p></p>
        <div class="tags">
        </div>
        <a href="#" class="card-link" target="_blank">Vedi repository &rarr;</a>
      </article>
    </section>
  </div>
</body>
</html>
